
services:
  postgres:
    image: postgres:16-alpine
    container_name: ollive-postgres-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ollive
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ollive"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
